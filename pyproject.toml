[project]
name = "rag-ai-agents"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Javier Flores", email = "javiflores302@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.14.0",
    "fastapi>=0.165.0",
    "inngest>=0.5.20",
    "llama-index-core>=0.14.26",
    "llama-index-readers-file>=0.8.0",
    "openai>=3.60.0",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.20.0",
    "streamlit>=1.67.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
rag-ai-agents = "rag_ai_agents:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
